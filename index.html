<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DiBETSA 2026 Delegate Scanner
  </title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f5f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 30px;
      margin: 0 0 25px;
    }

    #exhibitorDisplay {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #databaseStatus {
      text-align: center;
      font-size: 15px;
      margin-bottom: 25px;
      color: #555;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #status {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 30px 0;
      min-height: 30px;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 35px 0;
    }

    .manual-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #bbb;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: auto;
      padding: 16px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .container {
        padding: 25px 18px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 26px;
      }

      #exhibitorDisplay {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    DiBETSA 2026
  </h1>

  <div class="subtitle">
    Scan Delegate Badge
  </div>

  <div id="exhibitorDisplay">
    Exhibitor:
  </div>

  <div id="databaseStatus">
    Loading delegate database...
  </div>

  <div id="reader"></div>

  <div id="status">
    Ready to scan
  </div>

  <div class="divider"></div>

  <div class="manual-title">
    Or enter delegate email manually
  </div>

  <input
    type="email"
    id="manualEmail"
    placeholder="delegate@email.com"
    autocomplete="off"
  >

  <button
    type="button"
    onclick="manualLookup()"
  >
    Find Delegate
  </button>

</div>


<script>


/*
==================================================
SETTINGS
==================================================
*/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzzRAf6Ab34ohsWS7YSZNAMvO2eFHZmNcJYZIhNnFP8qfdaXH5g_Fgber84A-xvcgfK/exec";


const JOTFORM_URL =
  "https://form.jotform.com/262452140703043";


const LOCAL_DATABASE_KEY =
  "DIBETSA_DELEGATE_DATABASE_V1";


const LOCAL_DATABASE_TIME_KEY =
  "DIBETSA_DELEGATE_DATABASE_TIME_V1";



/*
==================================================
EXHIBITOR
==================================================
*/

const pageParams =
  new URLSearchParams(
    window.location.search
  );


const exhibitor =
  pageParams.get("exhibitor") || "";


document.getElementById(
  "exhibitorDisplay"
).textContent =
  "Exhibitor: " +
  (exhibitor || "Not specified");



/*
==================================================
STATE
==================================================
*/

let delegates = {};

let scanLocked = false;

let lookupInProgress = false;

let databaseScript = null;

let fallbackScript = null;

let requestedFallbackEmail = "";



/*
==================================================
STATUS
==================================================
*/

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}



function setDatabaseStatus(
  message
) {

  document.getElementById(
    "databaseStatus"
  ).textContent =
    message;

}



/*
==================================================
LOAD SAVED LOCAL DATABASE IMMEDIATELY
==================================================
*/

function loadLocalDatabase() {

  try {

    const saved =
      localStorage.getItem(
        LOCAL_DATABASE_KEY
      );


    if (!saved) {

      return false;

    }


    const parsed =
      JSON.parse(saved);


    if (
      !parsed ||
      typeof parsed !== "object"
    ) {

      return false;

    }


    delegates =
      parsed;


    const savedTime =
      localStorage.getItem(
        LOCAL_DATABASE_TIME_KEY
      );


    if (savedTime) {

      const date =
        new Date(
          Number(savedTime)
        );


      setDatabaseStatus(
        Object.keys(
          delegates
        ).length +
        " delegates ready • refreshing in background"
      );

    } else {

      setDatabaseStatus(
        Object.keys(
          delegates
        ).length +
        " delegates ready"
      );

    }


    return true;


  } catch (error) {

    console.log(
      "Local database error:",
      error
    );


    return false;

  }

}



/*
==================================================
BACKGROUND DATABASE REFRESH
==================================================
*/

function refreshDelegateDatabase() {

  /*
   * Remove previous script.
   */
  if (databaseScript) {

    databaseScript.remove();

    databaseScript = null;

  }


  databaseScript =
    document.createElement(
      "script"
    );


  databaseScript.src =
    APPS_SCRIPT_URL +
    "?action=delegates" +
    "&callback=receiveDelegateDatabase" +
    "&_=" +
    Date.now();


  databaseScript.onerror =
    function() {

      setDatabaseStatus(
        Object.keys(
          delegates
        ).length
          ? "Using saved delegate database"
          : "Could not refresh delegate database"
      );

    };


  document.body.appendChild(
    databaseScript
  );

}



/*
==================================================
DATABASE CALLBACK
==================================================
*/

window.receiveDelegateDatabase =
  function(result) {


    if (
      databaseScript
    ) {

      databaseScript.remove();

      databaseScript = null;

    }


    if (
      !result ||
      !result.success ||
      !result.delegates
    ) {

      return;

    }


    delegates =
      result.delegates;


    try {

      localStorage.setItem(
        LOCAL_DATABASE_KEY,
        JSON.stringify(
          delegates
        )
      );


      localStorage.setItem(
        LOCAL_DATABASE_TIME_KEY,
        Date.now().toString()
      );

    } catch (error) {

      console.log(
        "Could not save local database:",
        error
      );

    }


    setDatabaseStatus(
      Object.keys(
        delegates
      ).length +
      " delegates ready"
    );

  };



/*
==================================================
LOCAL LOOKUP
==================================================
*/

function lookupDelegate(email) {

  email =
    String(email || "")
    .trim()
    .toLowerCase();


  if (!email) {

    setStatus(
      "No delegate email detected."
    );

    scanLocked = false;

    return;

  }


  /*
   * FAST PATH:
   * Match directly on the phone.
   */
  if (
    delegates[email]
  ) {

    const delegate =
      delegates[email];


    setStatus(
      "Delegate found: " +
      (
        delegate.fullName ||
        delegate.firstName ||
        delegate.email
      )
    );


    openLeadForm(
      delegate
    );


    return;

  }


  /*
   * Delegate may have registered seconds ago.
   * Use server only as fallback.
   */
  setStatus(
    "Checking new registration..."
  );


  lookupDelegateOnline(
    email
  );

}



/*
==================================================
ONLINE FALLBACK
==================================================
*/

function lookupDelegateOnline(
  email
) {

  if (
    lookupInProgress
  ) {

    return;

  }


  lookupInProgress =
    true;


  requestedFallbackEmail =
    email;


  if (
    fallbackScript
  ) {

    fallbackScript.remove();

    fallbackScript = null;

  }


  fallbackScript =
    document.createElement(
      "script"
    );


  fallbackScript.src =
    APPS_SCRIPT_URL +
    "?email=" +
    encodeURIComponent(
      email
    ) +
    "&callback=receiveFallbackDelegate" +
    "&_=" +
    Date.now();


  fallbackScript.onerror =
    function() {


      lookupInProgress =
        false;


      scanLocked =
        false;


      setStatus(
        "Delegate not found. Please try again."
      );

    };


  document.body.appendChild(
    fallbackScript
  );

}



/*
==================================================
ONLINE FALLBACK CALLBACK
==================================================
*/

window.receiveFallbackDelegate =
  function(delegate) {


    if (
      fallbackScript
    ) {

      fallbackScript.remove();

      fallbackScript = null;

    }


    lookupInProgress =
      false;


    if (
      !delegate ||
      !delegate.success
    ) {

      scanLocked =
        false;


      setStatus(
        delegate &&
        delegate.message
          ? delegate.message
          : "Delegate not found."
      );


      return;

    }


    const returnedEmail =
      String(
        delegate.email || ""
      )
      .trim()
      .toLowerCase();


    if (
      returnedEmail !==
      requestedFallbackEmail
    ) {

      scanLocked =
        false;


      setStatus(
        "Delegate mismatch. Please scan again."
      );


      return;

    }


    /*
     * Add brand-new delegate immediately
     * to phone database.
     */
    delegates[
      returnedEmail
    ] =
      delegate;


    try {

      localStorage.setItem(
        LOCAL_DATABASE_KEY,
        JSON.stringify(
          delegates
        )
      );

    } catch (error) {

      console.log(error);

    }


    openLeadForm(
      delegate
    );

  };



/*
==================================================
OPEN JOTFORM
==================================================
*/

function openLeadForm(
  data
) {

  const jotformParams =
    new URLSearchParams();


  jotformParams.set(
    "fullName[first]",
    String(
      data.firstName || ""
    )
  );


  jotformParams.set(
    "fullName[last]",
    String(
      data.lastName || ""
    )
  );


  jotformParams.set(
    "company",
    String(
      data.company || ""
    )
  );


  jotformParams.set(
    "jobTitle",
    String(
      data.jobTitle || ""
    )
  );


  jotformParams.set(
    "email",
    String(
      data.email || ""
    )
  );


  jotformParams.set(
    "phoneNumber",
    String(
      data.phoneNumber || ""
    )
  );


  jotformParams.set(
    "city",
    String(
      data.city || ""
    )
  );


  jotformParams.set(
    "country",
    String(
      data.country || ""
    )
  );


  jotformParams.set(
    "exhibitor",
    String(
      exhibitor || ""
    )
  );


  jotformParams.set(
    "_scan",
    Date.now().toString()
  );


  const finalURL =
    JOTFORM_URL +
    "?" +
    jotformParams.toString();


  window.location.replace(
    finalURL
  );

}



/*
==================================================
QR SCANNER
==================================================
*/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    scanLocked ||
    lookupInProgress
  ) {

    return;

  }


  const scannedValue =
    String(
      decodedText || ""
    )
    .trim()
    .toLowerCase();


  if (!scannedValue) {
    return;
  }


  scanLocked =
    true;


  setStatus(
    "Badge scanned..."
  );


  lookupDelegate(
    scannedValue
  );

}



function onScanFailure(
  error
) {

  /*
   * Ignore normal camera frames.
   */

}



/*
==================================================
START SCANNER
==================================================
*/

const html5QrcodeScanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 15,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera:
        true,

      supportedScanTypes: [

        Html5QrcodeScanType
          .SCAN_TYPE_CAMERA

      ]

    },

    false

  );


html5QrcodeScanner.render(
  onScanSuccess,
  onScanFailure
);



/*
==================================================
MANUAL LOOKUP
==================================================
*/

function manualLookup() {

  if (
    lookupInProgress
  ) {

    return;

  }


  const email =
    document.getElementById(
      "manualEmail"
    )
    .value
    .trim()
    .toLowerCase();


  if (!email) {

    setStatus(
      "Please enter the delegate email."
    );

    return;

  }


  scanLocked =
    true;


  lookupDelegate(
    email
  );

}



/*
==================================================
ENTER KEY
==================================================
*/

document.getElementById(
  "manualEmail"
)
.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      manualLookup();

    }

  }

);



/*
==================================================
STARTUP
==================================================
*/

/*
 * Use yesterday's/previously downloaded
 * delegate database immediately.
 */
loadLocalDatabase();


/*
 * Refresh in background immediately.
 */
refreshDelegateDatabase();


/*
 * Keep checking for new registrations
 * every 30 seconds.
 *
 * This DOES NOT interrupt scanning.
 */
setInterval(
  refreshDelegateDatabase,
  30000
);


</script>

</body>

</html>
