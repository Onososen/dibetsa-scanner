<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DiBETSA 2026 Delegate Scanner
  </title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f5f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 30px;
      margin: 0 0 25px;
    }

    #exhibitorDisplay {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #status {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 30px 0;
      min-height: 30px;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 35px 0;
    }

    .manual-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #bbb;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: auto;
      padding: 16px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .container {
        padding: 25px 18px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 26px;
      }

      #exhibitorDisplay {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    DiBETSA 2026
  </h1>

  <div class="subtitle">
    Scan Delegate Badge
  </div>

  <div id="exhibitorDisplay">
    Exhibitor:
  </div>

  <div id="reader"></div>

  <div id="status">
    Ready to scan
  </div>

  <div class="divider"></div>

  <div class="manual-title">
    Or enter delegate email manually
  </div>

  <input
    type="email"
    id="manualEmail"
    placeholder="delegate@email.com"
    autocomplete="off"
  >

  <button
    type="button"
    onclick="manualLookup()"
  >
    Find Delegate
  </button>

</div>


<script>

  /*
  ==================================================
  SETTINGS
  ==================================================
  */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzzRAf6Ab34ohsWS7YSZNAMvO2eFHZmNcJYZIhNnFP8qfdaXH5g_Fgber84A-xvcgfK/exec";

  const JOTFORM_URL =
    "https://form.jotform.com/262452140703043";


  /*
  ==================================================
  GET EXHIBITOR
  ==================================================
  */

  const pageParams =
    new URLSearchParams(
      window.location.search
    );

  const exhibitor =
    pageParams.get("exhibitor") || "";

  document.getElementById(
    "exhibitorDisplay"
  ).textContent =
    "Exhibitor: " +
    (exhibitor || "Not specified");


  /*
  ==================================================
  STATUS
  ==================================================
  */

  function setStatus(message) {

    document.getElementById(
      "status"
    ).textContent = message;

  }


  /*
  ==================================================
  LOOKUP STATE
  ==================================================
  */

  let lookupInProgress = false;
  let scanLocked = false;


  /*
  ==================================================
  LOOK UP DELEGATE
  ==================================================
  */

  async function lookupDelegate(email) {

    email =
      String(email || "")
      .trim()
      .toLowerCase();


    if (!email) {

      setStatus(
        "No delegate email detected."
      );

      scanLocked = false;

      return;
    }


    if (lookupInProgress) {
      return;
    }


    lookupInProgress = true;


    setStatus(
      "Looking up delegate..."
    );


    try {

      /*
      Unique request value prevents
      any cached lookup response.
      */

      const requestId =
        Date.now().toString() +
        Math.random()
        .toString(36)
        .substring(2);


      const lookupURL =
        APPS_SCRIPT_URL +
        "?email=" +
        encodeURIComponent(email) +
        "&requestId=" +
        encodeURIComponent(requestId);


      const response =
        await fetch(
          lookupURL,
          {
            method: "GET",
            cache: "no-store",
            redirect: "follow"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Lookup service returned " +
          response.status
        );

      }


      const data =
        await response.json();


      /*
      Make sure returned delegate
      actually matches the scanned email.
      */

      const returnedEmail =
        String(
          data.email || ""
        )
        .trim()
        .toLowerCase();


      if (!data.success) {

        setStatus(
          data.message ||
          "Delegate not found."
        );

        lookupInProgress = false;
        scanLocked = false;

        return;
      }


      if (
        returnedEmail !== email
      ) {

        throw new Error(
          "Lookup returned the wrong delegate."
        );

      }


      setStatus(
        "Delegate found: " +
        (
          data.fullName ||
          data.firstName ||
          data.email
        ) +
        ". Opening lead form..."
      );


      /*
      ==================================================
      BUILD COMPLETELY FRESH JOTFORM URL
      ==================================================
      */

      const jotformParams =
        new URLSearchParams();


      /*
      Fresh unique value for every scan.

      This helps prevent the browser/Jotform
      from treating consecutive scans as the
      same form session.
      */

      const freshFormId =
        Date.now().toString() +
        "-" +
        Math.random()
        .toString(36)
        .substring(2, 10);


      jotformParams.set(
        "fullName[first]",
        String(
          data.firstName || ""
        )
      );


      jotformParams.set(
        "fullName[last]",
        String(
          data.lastName || ""
        )
      );


      jotformParams.set(
        "company",
        String(
          data.company || ""
        )
      );


      jotformParams.set(
        "jobTitle",
        String(
          data.jobTitle || ""
        )
      );


      jotformParams.set(
        "email",
        String(
          data.email || ""
        )
      );


      jotformParams.set(
        "phoneNumber",
        String(
          data.phoneNumber || ""
        )
      );


      jotformParams.set(
        "country",
        String(
          data.country || ""
        )
      );


      jotformParams.set(
        "city",
        String(
          data.city || ""
        )
      );


      jotformParams.set(
        "exhibitor",
        String(
          exhibitor || ""
        )
      );


      /*
      Cache/session breaker.
      Jotform ignores unknown parameters,
      but the URL becomes unique each time.
      */

      jotformParams.set(
        "_scan",
        freshFormId
      );


      const finalURL =
        JOTFORM_URL +
        "?" +
        jotformParams.toString();


      /*
      Small delay only after we already
      have the NEW delegate data.

      This guarantees the redirect cannot
      happen before the lookup is finished.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            350
          )
      );


      window.location.replace(
        finalURL
      );

    }

    catch (error) {

      console.error(
        "Delegate lookup error:",
        error
      );


      setStatus(
        "Could not retrieve the new delegate details. Please scan again."
      );


      lookupInProgress = false;
      scanLocked = false;

    }

  }


  /*
  ==================================================
  QR SCANNER
  ==================================================
  */

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (
      scanLocked ||
      lookupInProgress
    ) {
      return;
    }


    const scannedValue =
      String(
        decodedText || ""
      )
      .trim();


    if (!scannedValue) {
      return;
    }


    scanLocked = true;


    setStatus(
      "Badge scanned. Checking delegate..."
    );


    /*
    Stop camera only after
    a QR value has been captured.
    */

    Promise.resolve(
      html5QrcodeScanner.clear()
    )
    .catch(
      error => {
        console.log(
          "Scanner clear:",
          error
        );
      }
    );


    lookupDelegate(
      scannedValue
    );

  }


  function onScanFailure(error) {

    /*
    Ignore normal QR detection failures.
    */

  }


  const html5QrcodeScanner =
    new Html5QrcodeScanner(

      "reader",

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera:
          true,

        supportedScanTypes: [
          Html5QrcodeScanType
          .SCAN_TYPE_CAMERA
        ]
      },

      false

    );


  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );


  /*
  ==================================================
  MANUAL LOOKUP
  ==================================================
  */

  function manualLookup() {

    if (lookupInProgress) {
      return;
    }


    const email =
      document.getElementById(
        "manualEmail"
      )
      .value
      .trim();


    if (!email) {

      setStatus(
        "Please enter the delegate email."
      );

      return;
    }


    lookupDelegate(
      email
    );

  }


  /*
  ==================================================
  ENTER KEY
  ==================================================
  */

  document.getElementById(
    "manualEmail"
  )
  .addEventListener(
    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        manualLookup();

      }

    }

  );

</script>

</body>

</html>
