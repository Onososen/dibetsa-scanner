<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DiBETSA 2026 Delegate Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f5f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 30px;
      margin: 0 0 25px;
    }

    #exhibitorDisplay {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #status {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 30px 0;
      min-height: 30px;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 35px 0;
    }

    .manual-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #bbb;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: auto;
      padding: 16px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .container {
        padding: 25px 18px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 26px;
      }

      #exhibitorDisplay {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>DiBETSA 2026</h1>

  <div class="subtitle">
    Scan Delegate Badge
  </div>

  <div id="exhibitorDisplay">
    Exhibitor:
  </div>

  <div id="reader"></div>

  <div id="status">
    Ready to scan
  </div>

  <div class="divider"></div>

  <div class="manual-title">
    Or enter delegate email manually
  </div>

  <input
    type="email"
    id="manualEmail"
    placeholder="delegate@email.com"
  >

  <button onclick="manualLookup()">
    Find Delegate
  </button>

</div>


<script>

  /*
  ==================================================
  SETTINGS
  ==================================================
  */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzzRAf6Ab34ohsWS7YSZNAMvO2eFHZmNcJYZIhNnFP8qfdaXH5g_Fgber84A-xvcgfK/exec";

  const JOTFORM_URL =
    "https://form.jotform.com/262452140703043";


  /*
  ==================================================
  GET EXHIBITOR
  ==================================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const exhibitor =
    params.get("exhibitor") || "";

  document.getElementById(
    "exhibitorDisplay"
  ).textContent =
    "Exhibitor: " +
    (exhibitor || "Not specified");


  /*
  ==================================================
  STATUS
  ==================================================
  */

  function setStatus(message) {

    document.getElementById(
      "status"
    ).textContent = message;

  }


  /*
  ==================================================
  LOOK UP DELEGATE
  ==================================================
  */

  async function lookupDelegate(email) {

    email =
      String(email || "")
      .trim();

    if (!email) {

      setStatus(
        "No delegate email detected."
      );

      return;
    }


    setStatus(
      "Looking up delegate..."
    );


    try {

      const lookupURL =
        APPS_SCRIPT_URL +
        "?email=" +
        encodeURIComponent(email) +
        "&t=" +
        Date.now();


      const response =
        await fetch(
          lookupURL,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Lookup service returned " +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.success) {

        setStatus(
          data.message ||
          "Delegate not found."
        );

        return;
      }


      setStatus(
        "Delegate found. Opening lead form..."
      );


      /*
      ==================================================
      BUILD JOTFORM URL
      ==================================================
      */

      const jotformParams =
        new URLSearchParams();


      jotformParams.set(
        "fullName[first]",
        data.firstName || ""
      );


      jotformParams.set(
        "fullName[last]",
        data.lastName || ""
      );


      jotformParams.set(
        "company",
        data.company || ""
      );


      jotformParams.set(
        "jobTitle",
        data.jobTitle || ""
      );


      jotformParams.set(
        "email",
        data.email || ""
      );


      jotformParams.set(
        "phoneNumber",
        data.phoneNumber || ""
      );


      jotformParams.set(
        "country",
        data.country || ""
      );


      jotformParams.set(
        "city",
        data.city || ""
      );


      jotformParams.set(
        "exhibitor",
        exhibitor
      );


      const finalURL =
        JOTFORM_URL +
        "?" +
        jotformParams.toString();


      /*
      IMPORTANT:
      GitHub performs the redirect directly.
      Google Apps Script does NOT redirect to Jotform.
      */

      window.location.href =
        finalURL;

    }

    catch (error) {

      console.error(error);

      setStatus(
        "Could not retrieve delegate details. Please try again."
      );

    }

  }


  /*
  ==================================================
  QR SCANNER
  ==================================================
  */

  let scanLocked = false;


  function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (scanLocked) {
      return;
    }


    scanLocked = true;


    const scannedValue =
      String(decodedText || "")
      .trim();


    setStatus(
      "Badge scanned. Looking up delegate..."
    );


    /*
    Stop camera after successful scan
    */

    try {

      html5QrcodeScanner.clear();

    }

    catch (error) {

      console.log(
        "Scanner clear:",
        error
      );

    }


    lookupDelegate(
      scannedValue
    );

  }


  function onScanFailure(error) {

    /*
    Normal scan failures happen continuously
    while camera is searching for QR code.

    Do nothing here.
    */

  }


  const html5QrcodeScanner =
    new Html5QrcodeScanner(

      "reader",

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera:
          true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },

      false
    );


  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );


  /*
  ==================================================
  MANUAL LOOKUP
  ==================================================
  */

  function manualLookup() {

    const email =
      document.getElementById(
        "manualEmail"
      ).value.trim();


    if (!email) {

      setStatus(
        "Please enter the delegate email."
      );

      return;
    }


    lookupDelegate(email);

  }


  /*
  Allow ENTER key
  */

  document.getElementById(
    "manualEmail"
  ).addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        manualLookup();

      }

    }
  );

</script>

</body>
</html>
